
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAIN FX FINAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0a0a;color:#fff;display:flex;justify-content:center;padding:15px}
.card{background:#1a0e0e;border-radius:25px;padding:20px;width:100%;max-width:400px;border:1px solid #333}
.logo{text-align:center} .logo h1{font-size:32px} .logo h1 span:last-child{color:#ff2a2a}
.logo p{font-size:10px;letter-spacing:3px;color:#888;margin-top:5px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}
.stat{background:#0f0f0f;border-radius:12px;padding:12px;text-align:center;border:1px solid #222}
.stat p{font-size:10px;color:#888} .stat h2{font-size:20px;margin-top:4px}
.green{color:#00ff88} .red{color:#ff4444} .yellow{color:#ffcc00}
select{width:100%;background:#0f0f0f;color:#fff;border:1px solid #333;border-radius:12px;padding:14px;margin:8px 0}
.signal{background:#0f0f0f;border:1px dashed #333;border-radius:15px;padding:20px;text-align:center;margin:15px 0}
.winloss{display:none;gap:10px;margin-top:15px} .winloss.show{display:flex}
.btn-win,.btn-loss{flex:1;padding:14px;border:none;border-radius:12px;font-weight:bold;cursor:pointer}
.btn-win{background:#00c853;color:#fff} .btn-loss{background:#d50000;color:#fff}
.gen{width:100%;padding:18px;background:linear-gradient(90deg,#d4af37,#f9e27d,#d4af37);border:none;border-radius:15px;font-weight:bold;font-size:16px;color:#000}
.reset{text-align:center;font-size:11px;color:#555;margin-top:10px;text-decoration:underline}
</style>
</head>
<body>
<div class="card">
<div class="logo"><h1><span>ZAIN</span> <span style="color:#ff2a2a">FX</span></h1><p>AI TRADING BOT • LIFETIME COUNTING</p></div>

<div class="stats">
<div class="stat"><p>TOTAL</p><h2 id="total">0</h2></div>
<div class="stat"><p style="color:#00ff88">WINS</p><h2 id="wins" class="green">0</h2></div>
<div class="stat"><p style="color:#ff4444">LOSSES</p><h2 id="loss" class="red">0</h2></div>
<div class="stat"><p>ACCURACY</p><h2 id="acc" class="yellow">0%</h2></div>
</div>

<label style="font-size:11px;color:#888">SELECT PAIR</label>
<select id="pair"><option>EUR/USD</option><option>EUR/USD (OTC)</option><option>GBP/USD</option><option>GBP/USD (OTC)</option><option>USD/JPY (OTC)</option></select>

<label style="font-size:11px;color:#888">TIMEFRAME</label>
<select id="tf"><option>1 MIN</option><option>30 SEC</option><option>15 SEC</option></select>

<div class="signal" id="box">
<h3 id="ready" style="font-size:11px;color:#666;letter-spacing:2px">READY FOR ANALYSIS</h3>
<h2 id="sig" style="margin-top:8px;color:#555">Click Generate</h2>
<p id="info" style="font-size:11px;color:#888;margin-top:8px"></p>
<div class="winloss" id="wl">
<button class="btn-win" onclick="mark(1)">✅ WIN</button>
<button class="btn-loss" onclick="mark(0)">❌ LOSS</button>
</div>
</div>

<button class="gen" onclick="generate()">GENERATE VIP SIGNAL 🚀</button>
<div class="reset" onclick="resetAll()">Reset Count 0 karna ho to yahan dabao</div>
</div>

<script>
let t=parseInt(localStorage.getItem('zt')||0), w=parseInt(localStorage.getItem('zw')||0), l=parseInt(localStorage.getItem('zl')||0);
upd();
function generate(){
 let p=document.getElementById('pair').value, tf=document.getElementById('tf').value;
 let buy=Math.random()>0.5, acc=Math.floor(Math.random()*11)+85;
 document.getElementById('ready').innerText=p+" • "+tf+" • LIVE";
 document.getElementById('sig').innerText=buy?"BUY 📈":"SELL 📉";
 document.getElementById('sig').style.color=buy?"#00ff88":"#ff4444";
 document.getElementById('info').innerText="Predicted "+acc+"% • Ab Quotex par "+(buy?"BUY":"SELL")+" lagao";
 document.getElementById('wl').classList.add('show');
}
function mark(win){
 if(win){w++; t++;} else {l++; t++;}
 localStorage.setItem('zt',t); localStorage.setItem('zw',w); localStorage.setItem('zl',l);
 upd();
 document.getElementById('wl').classList.remove('show');
 document.getElementById('sig').innerText="Marked! Next Signal";
 document.getElementById('sig').style.color="#fff";
 document.getElementById('info').innerText="";
 document.getElementById('ready').innerText="READY FOR NEXT";
}
function upd(){
 document.getElementById('total').innerText=t;
 document.getElementById('wins').innerText=w;
 document.getElementById('loss').innerText=l;
 document.getElementById('acc').innerText=(t==0?0:Math.round(w/t*100))+"%";
}
function resetAll(){ if(confirm('Sach mein 0 karna hai?')){t=0;w=0;l=0;localStorage.clear();upd();}}
</script>
</body>
</html>
