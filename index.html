<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAIN AI TRADER - Chinese Signals v4</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00d4ff">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/4712/4712109.png">
<style>
body{background:#0a0e1a;color:#fff;font-family:monospace;padding:20px}
.card{background:#12182b;border:1px solid #1e2a4a;border-radius:16px;padding:20px;max-width:400px;margin:auto}
select,button{width:100%;padding:14px;border-radius:10px;margin-top:12px;background:#0e1426;color:#00d4ff;border:1px solid #00d4ff;font-weight:bold}
button{background:linear-gradient(90deg,#00d4ff,#00aaff);color:#000;font-size:16px}
.live{color:#00ff88} .price{color:#00d4ff;font-size:22px}
</style>
</head>
<body>
<div class="card">
<h2>🐼 Chinese Signals</h2>
<p>ZAIN AI • PRO MAX v4 <span class="live">● LIVE</span></p>
<p>MARKETS 8 LIVE | SAFE MODE ON</p>
<h3 style="text-align:center">GENERATE SIGNALS</h3>

<label>Select Broker</label>
<select id="broker">
<option>Quotex • REAL OTC</option>
<option>Pocket Option</option>
</select>

<label>Select Pair (Quotex OTC)</label>
<select id="pair">
<option>EUR/USD (OTC) • Quotex LIVE</option>
<option>GBP/USD (OTC) • Quotex LIVE</option>
<option>USD/BRL (OTC) • Quotex LIVE</option>
<option>USD/INR (OTC) • Quotex LIVE</option>
<option>USD/PKR (OTC) • Quotex LIVE</option>
<option>USDT/PKR (OTC) • Quotex LIVE</option>
<option>BTC/USDT (OTC) • Quotex LIVE</option>
<option>ETH/USDT (OTC) • Quotex LIVE</option>
</select>

<div style="display:flex;justify-content:space-between;margin-top:15px">
<div>LIVE PRICE<div class="price" id="price">1.08484</div></div>
<div>RSI(14)<div id="rsi">56.0</div></div>
<div>STATUS<div class="live">BULLISH</div></div>
</div>

<label>Select Expiry</label>
<select>
<option>5 Minutes - PRO SAFE</option>
<option>1 Minute - QUICK</option>
<option>2 Minutes - SCALP</option>
</select>

<button onclick="generate()">GENERATE PRO SIGNAL</button>
<p id="result" style="text-align:center;margin-top:15px;font-size:18px"></p>
</div>

<script>
function generate(){
 document.getElementById('result').innerHTML = '⏳ ANALYZING LIVE DATA...';
 setTimeout(()=>{
   let sig = Math.random() > 0.5 ? 'CALL ↑ GREEN' : 'PUT ↓ RED';
   let color = sig.includes('CALL') ? '#00ff88' : '#ff4444';
   document.getElementById('result').innerHTML = '<span style="color:'+color+';font-size:24px;font-weight:bold">'+sig+'</span><br><small>ENTRY NOW - Quotex</small>';
 },2000);
}
setInterval(()=>{
  let p = (1.08400 + Math.random()*0.002).toFixed(5);
  document.getElementById('price').innerText = p;
  document.getElementById('rsi').innerText = (50 + Math.random()*15).toFixed(1);
},1500);
</script>
</body>
</html>
