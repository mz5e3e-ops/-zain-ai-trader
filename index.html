
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MALIK ZAIN ALI - VIP BOT V8 ULTIMATE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070b15;color:#fff;font-family:Arial}
.top{padding:18px;text-align:center;background:radial-gradient(circle at top,#1a2a4a,#070b15)}
.robot{width:105px;height:105px;border-radius:50%;background:#111;margin:10px auto;border:3px solid #f5d06a;display:flex;align-items:center;justify-content:center;font-size:48px;box-shadow:0 0 25px #f5d06a80}
.badges{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.badge{padding:5px 12px;border-radius:20px;background:#0e2a1a;border:1px solid #00ff88;color:#00ff88;font-size:10px;font-weight:800}
.card{margin:12px;background:#111a2c;border:1px solid #1e335a;border-radius:18px;padding:14px}
select,input{width:100%;padding:14px;border-radius:12px;background:#0f1a2f;border:1px solid #243a5e;color:#fff;margin-bottom:10px;font-size:14px}
label{font-size:11px;color:#8aa0b8;font-weight:800;margin:6px 2px;display:block;letter-spacing:1px}
.gen{width:100%;padding:16px;border-radius:30px;border:none;background:linear-gradient(90deg,#f5d06a,#e8b84a);color:#000;font-weight:900;font-size:16px;cursor:pointer}
.bigbtn{width:100%;padding:18px;border-radius:14px;border:none;font-weight:900;font-size:17px;margin-top:10px}
.b-buy{background:#00ff88;color:#000}.b-sell{background:#ff3b3b;color:#fff}.b-wait{background:#2a344a;color:#8aa0b8}
.result{border-radius:18px;padding:14px;margin-top:14px;display:none}
.buy{border:1.5px solid #00ff88;background:#0a1e14;display:block}.sell{border:1.5px solid #ff3b3b;background:#1e0f14;display:block}.wait{border:1.5px solid #44566e;background:#111a2c;display:block}
.rulebox{background:#0f1a2f;border:1px dashed #243a5e;border-radius:12px;padding:10px;font-size:11px;color:#cbd5e1;line-height:1.5;margin-top:10px}
.chartbox{background:#0d1426;border:1px solid #1e335a;border-radius:16px;margin:12px;height:260px;overflow:hidden}
</style>
</head>
<body>
<div class="top">
<h1 style="margin:0;font-size:21px;letter-spacing:2px">MALIK ZAIN ALI</h1>
<div style="font-size:11px;color:#f5d06a;font-weight:900">VIP SIGNAL BOT • V8 ULTIMATE • REAL LOGIC 👑</div>
<div class="robot">👑</div>
<div class="badges"><span class="badge">● MALIK ZAIN ALI AI Connected</span><span class="badge">● Market Feed Synced</span></div>
</div>

<div class="chartbox">
<div id="tradingview_chart" style="height:260px"></div>
</div>

<div class="card">
<label>PAIR / MARKET</label>
<select id="pair"><option>EUR/USD (OTC)</option><option>GBP/USD (OTC)</option><option>USD/JPY (OTC)</option><option>NZD/CAD (OTC)</option><option>AUD/CAD (OTC)</option></select>
<label>TIMEFRAME</label>
<select id="tf"><option>15secs</option><option>30secs</option><option>1min</option><option>5min</option></select>
<label>PATTERN (Brutal Trader Notes)</label>
<select id="patternSel">
<option value="uptrend_3g1r">1. UPTREND: G G G + small r = BUY - BEST</option>
<option value="downtrend_3r1g">2. DOWNTREND: R R R + small g = SELL - BEST</option>
<option value="bull_engulf">3. BULLISH ENGULFING at Support</option>
<option value="bear_engulf">4. BEARISH ENGULFING at Resistance</option>
<option value="doji_buy">5. DOJI BUY: Long R + D + G</option>
<option value="doji_sell">6. DOJI SELL: Long G + D + R</option>
<option value="series25">7. SERIES 25: D < R < Long G</option>
</select>

<label>CANDLES LIKHO (G=Green, R=Red, D=Doji, r=choti)</label>
<div style="display:flex;gap:6px">
<input id="c1" value="G" style="text-align:center">
<input id="c2" value="G" style="text-align:center">
<input id="c3" value="G" style="text-align:center">
<input id="c4" value="r" style="text-align:center;border-color:#f5d06a">
</div>

<button class="gen" onclick="generateReal()">⚡ GENERATE SIGNAL ✨</button>

<div id="res" class="result">
<h2 id="rPair" style="margin:0;font-size:18px"></h2>
<div id="rInfo" style="margin-top:6px;font-size:12px;color:#8aa0b8"></div>
<div id="rPattern" style="margin-top:6px;font-size:14px;font-weight:900"></div>
<div id="rReason" class="rulebox"></div>
<button id="rBtn" class="bigbtn"></button>
</div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
new TradingView.widget({"autosize":true,"symbol":"FX:EURUSD","interval":"1","timezone":"Asia/Karachi","theme":"dark","style":"1","locale":"en","container_id":"tradingview_chart"});

function generateReal(){
 const pair=document.getElementById('pair').value;
 const tf=document.getElementById('tf').value;
 const pat=document.getElementById('patternSel').value;
 const seq=[document.getElementById('c1').value.toUpperCase(),document.getElementById('c2').value.toUpperCase(),document.getElementById('c3').value.toUpperCase(),document.getElementById('c4').value.toUpperCase()];
 const res=document.getElementById('res');
 const rPair=document.getElementById('rPair');const rInfo=document.getElementById('rInfo');const rPattern=document.getElementById('rPattern');const rReason=document.getElementById('rReason');const rBtn=document.getElementById('rBtn');
 res.style.display='block';
 rPair.innerText=pair+' • '+tf+' • '+seq.join(' > ');
 let signal='WAIT', title='', reason='', btnText='⏸️ WAIT', btnClass='b-wait';
 if(pat==='uptrend_3g1r' && seq[0]==='G' && seq[1]==='G' && seq[2]==='G' && (seq[3]==='R' || seq[3]==='r' || seq[3]==='D')){ signal='BUY'; title='BULLISH: Uptrend 3G + small Red 🟢'; reason='LOGIC MATCH: 3 Green ke baad choti Red jo previous Green ka low break na kare = BUY. RSI 30-55 + Support par entry. Ye aap ka best pattern hai, No MTG needed.'; btnText='⬆️ BUY / UP - 78% - Uptrend - '+tf; btnClass='b-buy'; }
 else if(pat==='downtrend_3r1g' && seq[0]==='R' && seq[1]==='R' && seq[2]==='R' && (seq[3]==='G' || seq[3]==='g')){ signal='SELL'; title='BEARISH: Downtrend 3R + small Green 🔴'; reason='LOGIC MATCH: 3 Red ke baad choti Green = SELL. Sellers strong.'; btnText='⬇️ SELL / DOWN - 77% - Downtrend - '+tf; btnClass='b-sell'; }
 else if(pat==='bull_engulf' && (seq[2]==='R' || seq[2]==='D') && seq[3]==='G'){ signal='BUY'; title='BULLISH: Bullish Engulfing 🟢'; reason='Choti Red/Doji ke baad bari Green engulf. Support + Volume = 82% win.'; btnText='⬆️ BUY - 82% - Bull Engulfing'; btnClass='b-buy'; }
 else if(pat==='bear_engulf' && (seq[2]==='G' || seq[2]==='D') && seq[3]==='R'){ signal='SELL'; title='BEARISH: Bearish Engulfing 🔴'; reason='Choti Green/Doji ke baad bari Red engulf. Resistance par SELL = Strongest.'; btnText='⬇️ SELL - 82% - Bear Engulfing'; btnClass='b-sell'; }
 else if(pat==='doji_buy' && seq[0]==='R' && seq[1]==='D' && seq[2]==='G'){ signal='BUY'; title='BULLISH: Doji Buy Setup 🟢'; reason='Long Red + Doji + Green = Sellers khatam.'; btnText='⬆️ BUY - 75% - Doji Buy'; btnClass='b-buy'; }
 else if(pat==='doji_sell' && seq[0]==='G' && seq[1]==='D' && seq[2]==='R'){ signal='SELL'; title='BEARISH: Doji Sell Setup 🔴'; reason='Long Green + Doji + Red = Buyers khatam.'; btnText='⬇️ SELL - 75% - Doji Sell'; btnClass='b-sell'; }
 else if(pat==='series25' && seq[1]==='D' && seq[2]==='R' && seq[3]==='G'){ signal='BUY'; title='BULLISH: Series 25 🟢'; reason='Doji < Red < Long Green jo SNR tore = Strong BUY.'; btnText='⬆️ BUY - 80% - Series 25'; btnClass='b-buy'; }
 else { title='WAIT - Pattern Match Nahi Hua'; reason='Aap ne likha: '+seq.join(',')+' - Is pattern ke liye sahi sequence likho. Beech market me trade mat lo. SNR ka wait karo.'; btnText='⏸️ WAIT - No Trade'; }
 rInfo.innerText='PAIR: '+pair+' | TF: '+tf+' | Input: '+seq.join('-');
 rPattern.innerText=title; rPattern.style.color=signal==='BUY'?'#00ff88':signal==='SELL'?'#ff3b3b':'#8aa0b8';
 rReason.innerText=reason; rBtn.innerText=btnText; rBtn.className='bigbtn '+btnClass;
 res.className='result '+(signal==='BUY'?'buy':signal==='SELL'?'sell':'wait');
}
</script>
</body>
</html>
