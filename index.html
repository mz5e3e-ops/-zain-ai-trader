
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAIN AI - Signal Generator</title>
<style>
*{box-sizing:border-box;font-family: 'Segoe UI',sans-serif}
body{margin:0;background:#0a0e13;color:#fff;min-height:100vh;display:flex;justify-content:center;padding:15px}
.container{width:100%;max-width:400px;background:#121821;border-radius:20px;padding:20px;border:1px solid #1e2a3a}
.header{text-align:center;margin-bottom:20px}
.header h1{color:#00ff88;font-size:22px;margin:10px 0 5px 0;font-weight:800}
.header p{color:#8a9bb0;font-size:13px;margin:0}
.label{color:#cbd5e0;font-size:13px;margin:18px 0 8px 5px;display:flex;align-items:center;gap:6px}
.select-box{background:#1a2533;border:1px solid #25344a;border-radius:12px;padding:14px;color:#fff;width:100%;outline:none;font-size:15px;appearance:none}
.select-wrap{position:relative}
.select-wrap:after{content:'▼';position:absolute;right:15px;top:50%;transform:translateY(-50%);color:#5a6d85;font-size:12px;pointer-events:none}
.btn-green{width:100%;background:#00ff88;color:#000;border:none;padding:16px;border-radius:14px;font-weight:800;font-size:15px;margin-top:22px;cursor:pointer;letter-spacing:0.5px}
.analyze-box{display:none;background:#0f1a14;border:1px solid #1a3a28;border-radius:14px;padding:16px;margin-top:18px}
.analyze-box p{color:#00ff88;font-size:13px;margin:0 0 10px 0;text-align:center}
.bar{width:100%;height:6px;background:#1a2a1f;border-radius:10px;overflow:hidden}
.bar-fill{height:100%;width:0%;background:#00ff88;transition:width 0.5s}
.btn-gray{width:100%;background:#1e2d3e;color:#8a9bb0;border:none;padding:14px;border-radius:14px;font-weight:600;font-size:14px;margin-top:12px;cursor:pointer}
.result-box{display:none;background:#0f1e14;border:1px solid #1e4a2e;border-radius:16px;padding:18px;margin-top:18px;text-align:center}
.result-title{color:#00ff88;font-weight:700;font-size:15px}
.sell-badge{display:inline-block;background:#2a1216;border:1px solid #ff3344;color:#ff3344;padding:8px 24px;border-radius:10px;font-weight:800;margin:12px 0;letter-spacing:1px}
.conf{color:#8a9bb0;font-size:13px}
.detail{text-align:left;margin-top:15px;font-size:13px;color:#8a9bb0;line-height:22px}
.detail b{color:#fff;float:right}
.btn-orange
