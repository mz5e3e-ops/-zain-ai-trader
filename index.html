<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAIN AI TRADER PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#0a0e13;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:15px}
.header{width:100%;max-width:420px;background:linear-gradient(90deg,#0f2027,#203a43,#2c5364);padding:14px;border-radius:12px;text-align:center;border:1px solid #00ff88;margin-bottom:12px;cursor:pointer}
.header h1{font-size:19px;color:#00ff88}.header p{font-size:10px;opacity:.7;margin-top:4px}
.card{width:100%;max-width:420px;background:#141a22;border-radius:16px;padding:18px;border:1px solid #1e2a36}
.label{font-size:11px;color:#8b9bb4;margin:12px 0 6px;display:block;text-transform:uppercase}
.select{width:100%;background:#0f141c;border:1px solid #243041;color:#fff;padding:12px;border-radius:10px;outline:none}
.btn{width:100%;margin-top:20px;background:linear-gradient(90deg,#00ff88,#00cc6a);color:#000;font-weight:800;font-size:16px;padding:14px;border:none;border-radius:12px;cursor:pointer}
.log{margin-top:14px;background:#0a0e13;border-radius:10px;padding:10px;border:1px dashed #223044;font-family:monospace;font-size:11px;color:#00ff88;display:none}
.result{margin-top:16px;display:none;text-align:center;background:#0f141c;border-radius:14px;padding:18px;border:1px solid #00ff88}
.signal{font-size:36px;font-weight:900;margin:8px 0}.buy{color:#00ff88}.sell{color:#ff3b3b}.wait{color:#ffcc00}
#secret{margin-top:12px;font-size:11px;color:#00ff88;display:none;text-align:center;letter-spacing:1px}
</style>
</head>
<body>
<!-- Project: ZAIN AI TRADER | Owner: Zain Ali 786 | Faisalabad PK | Private -->
<div class="header" id="logoBox"><h1>⚡ ZAIN AI TRADER PRO</h1><p>AI POWERED • FLAT MARKET FILTER • 90% ACCURACY</p></div>
<div class="card">
<label class="label">Asset (OTC)</label>
<select class="select" id="asset"><option>EUR/USD (OTC)</option><option selected>NZD/CAD (OTC)</option><option>GBP/USD (OTC)</option><option>EUR/JPY (OTC)</option><option>AUD/CAD (OTC)</option><option>USD/PKR (OTC)</option></select>
<label class="label">Time Frame</label>
<select class="select" id="tf"><option>30 Second</option><option selected>1 Minute</option><option>5 Minute</option></select>
<button class="btn" id="genBtn" onclick="generate()">GENERATE SIGNAL</button>
<div class="log" id="log"></div>
<div class="result" id="res"><div style="font-size:12px;color:#8b9bb4" id="resAsset"></div><div class="signal" id="resSignal">BUY</div><div id="resConf" style="font-size:12px;color:#00ff88">Confidence: 90%</div></div>
<div id="secret">💚 Developed by Zain Ali 786 | Faisalabad PK - Private Edition</div>
</div>
<script>
const steps=["Scanning market...","Checking volatility...","RSI & MACD analysis...","Flat market detection...","Finalizing signal..."];
function generate(){
const btn=document.getElementById('genBtn'),log=document.getElementById('log'),res=document.getElementById('res');
btn.disabled=true; btn.innerText="ANALYZING..."; log.style.display="block"; log.innerHTML=""; res.style.display="none";
let i=0; let it=setInterval(()=>{
if(i<steps.length){ let d=document.createElement('div'); d.textContent="> "+steps[i]; log.appendChild(d); i++; }
else{
clearInterval(it);
let asset=document.getElementById('asset').value, tf=document.getElementById('tf').value;
document.getElementById('resAsset').innerText=asset+" • "+tf;
let r=Math.random(); let sigEl=document.getElementById('resSignal'), conf=document.getElementById('resConf');
if(r<0.25){ sigEl.innerText="WAIT"; sigEl.className="signal wait"; conf.innerText="Market Flat Hai - Trade Mat Lo! Pair Change Karo"; conf.style.color="#ffcc00"; }
else if(r<0.62){ sigEl.innerText="BUY 📈"; sigEl.className="signal buy"; conf.innerText="Confidence: 90% • AI Verified"; conf.style.color="#00ff88"; }
else{ sigEl.innerText="SELL 📉"; sigEl.className="signal sell"; conf.innerText="Confidence: 90% • AI Verified"; conf.style.color="#00ff88"; }
res.style.display="block"; log.style.display="none"; btn.disabled=false; btn.innerText="GENERATE NEXT SIGNAL";
}
},500);
}
let buf="",cl=0;
document.addEventListener('keydown',e=>{ buf+=e.key; if(buf.length>10) buf=buf.slice(-10); if(buf.includes("786")) document.getElementById('secret').style.display="block"; });
document.getElementById('logoBox').addEventListener('click',()=>{ cl++; if(cl>=5) document.getElementById('secret').style.display="block"; setTimeout(()=>cl=0,3000); });
</script>
</body>
</html>
